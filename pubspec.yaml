name: hydrop
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # https://pub.dev/packages/auto_route
  auto_route: ^11.1.0

  # https://pub.dev/packages/cached_network_image
  cached_network_image: ^3.4.1

  # https://pub.dev/packages/dio
  dio: ^5.9.2

  # https://pub.dev/packages/file_picker
  file_picker: ^11.0.2

  # https://pub.dev/packages/crypto
  crypto: ^3.0.7

  # https://pub.dev/packages/drift
  drift: ^2.31.0

  # https://pub.dev/packages/drift_flutter
  drift_flutter: ^0.2.8

  # https://pub.dev/packages/flutter_riverpod
  flutter_riverpod: ^3.2.1

  # https://pub.dev/packages/freezed_annotation
  freezed_annotation: ^3.1.0

  # https://pub.dev/packages/json_annotation
  json_annotation: ^4.11.0

  # https://pub.dev/packages/path_provider
  path_provider: ^2.1.5

  # https://pub.dev/packages/qr_flutter
  qr_flutter: ^4.1.0

  # https://pub.dev/packages/mobile_scanner
  mobile_scanner: ^7.2.0

  # https://pub.dev/packages/network_info_plus
  network_info_plus: ^8.1.0

  # https://pub.dev/packages/riverpod
  riverpod: ^3.2.1

  # https://pub.dev/packages/riverpod_annotation
  riverpod_annotation: ^4.0.2

  # https://pub.dev/packages/share_plus
  share_plus: ^13.1.0

  # https://pub.dev/packages/talker
  talker: ^5.1.16

  # https://pub.dev/packages/talker_flutter
  talker_flutter: ^5.1.17

  # https://pub.dev/packages/talker_riverpod_logger
  talker_riverpod_logger: ^5.1.17

dependency_overrides:
  # file_picker 11.x constrains win32 to ^5.9.0 while talker_flutter/share_plus
  # already require win32 ^6.0.1. Keep the requested file_picker version and
  # force the shared transitive package to the version already used by the app.
  win32: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # https://pub.dev/packages/auto_route#introduction
  auto_route_generator: ^10.4.0

  # https://pub.dev/packages/build_runner
  build_runner: ^2.14.1

  # https://pub.dev/packages/drift_dev
  drift_dev: ^2.31.0

  #  https://pub:dev/packages/flutter_lints
  flutter_lints: ^6.0.0

  # https://pub.dev/packages/freezed
  freezed: ^3.2.5

  # https://pub.dev/packages/flutter_gen_runner
  flutter_gen_runner: ^5.14.1

  # https://pub.dev/packages/json_serializable
  json_serializable: ^6.11.3

  # https://pub.dev/packages/riverpod_generator
  riverpod_generator: ^4.0.3

  # https://pub.dev/packages/sqlite3
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_gen:
  output: lib/gen/

  integrations:
    image: true
    flutter_svg: false
    rive: false
    lottie: false

  colors:
    inputs:
      - assets/color/colors.xml
