<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background"><rect width="1280" height="720" fill="#F7F9FC"/><circle cx="1090" cy="118" r="230" fill="#E8F2FF" fill-opacity="0.82"/><path d="M56 612 H1224" stroke="#D0D0D0" stroke-width="2"/></g>
  <g id="header"><text x="56" y="70" font-family='SimHei, "Microsoft YaHei", sans-serif' font-size="34" fill="#0D0D0D" font-weight="900">研究思路：四层架构把复杂问题拆开</text><text x="56" y="106" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#5F6368">老师看这一页就能知道：界面、业务、数据、网络分别放在哪里。</text></g>
  <g id="architecture">
    <rect x="128" y="164" width="1024" height="78" rx="20" fill="#FFFFFF" fill-opacity="0.94" stroke="#D0D0D0" stroke-width="2"/>
    <text x="174" y="213" font-family='SimHei, "Microsoft YaHei", sans-serif' font-size="26" fill="#0D0D0D" font-weight="900">Presentation</text><text x="440" y="213" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" fill="#5F6368">页面、响应式布局、用户操作</text>
    <rect x="128" y="270" width="1024" height="78" rx="20" fill="#F3F8FF" stroke="#B8D7FB" stroke-width="2"/>
    <text x="174" y="319" font-family='SimHei, "Microsoft YaHei", sans-serif' font-size="26" fill="#0D0D0D" font-weight="900">Application</text><text x="440" y="319" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" fill="#5F6368">AppRuntime、发现控制、传输编排</text>
    <rect x="128" y="376" width="1024" height="78" rx="20" fill="#FFFFFF" fill-opacity="0.94" stroke="#D0D0D0" stroke-width="2"/>
    <text x="174" y="425" font-family='SimHei, "Microsoft YaHei", sans-serif' font-size="26" fill="#0D0D0D" font-weight="900">Data</text><text x="440" y="425" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" fill="#5F6368">Drift、DAO、Repository、状态来源</text>
    <rect x="128" y="482" width="1024" height="78" rx="20" fill="#FFFFFF" fill-opacity="0.94" stroke="#D0D0D0" stroke-width="2"/>
    <text x="174" y="531" font-family='SimHei, "Microsoft YaHei", sans-serif' font-size="26" fill="#0D0D0D" font-weight="900">Remote / Platform</text><text x="440" y="531" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" fill="#5F6368">UDP、TCP、文件选择、通知、平台能力</text>
    <path d="M640 242 V270 M640 348 V376 M640 454 V482" stroke="#0169CC" stroke-width="4"/>
  </g>
  <g id="rule"><rect x="278" y="592" width="724" height="40" rx="16" fill="#0D0D0D"/><text x="392" y="618" font-family='SimHei, "Microsoft YaHei", sans-serif' font-size="18" fill="#FFFFFF" font-weight="900">原则：UI 不直接操作 Socket、Drift 或平台 API。</text></g>
  <g id="footer"><text x="56" y="666" font-family='Consolas, "Courier New", monospace' font-size="12" fill="#5F6368">lib/presentation · lib/application · lib/data · lib/core</text><text x="1160" y="666" font-family='Consolas, "Courier New", monospace' font-size="12" fill="#5F6368">05/14</text></g>
</svg>
