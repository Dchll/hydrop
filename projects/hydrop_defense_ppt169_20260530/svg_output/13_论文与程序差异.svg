  <g id="answer"><rect x="212" y="552" width="856" height="48" rx="18" fill="#0D0D0D"/><text x="290" y="583" font-family='SimHei, "Microsoft YaHei", sans-serif' font-size="18" fill="#FFFFFF" font-weight="900">答辩口径：论文讲设计依据，演示展示当前源码完善后的状态。</text></g>
