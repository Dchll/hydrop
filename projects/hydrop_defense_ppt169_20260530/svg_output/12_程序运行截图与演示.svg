  <g id="time"><rect x="268" y="532" width="744" height="48" rx="18" fill="#F3F8FF" stroke="#B8D7FB" stroke-width="2"/><text x="366" y="563" font-family='SimHei, "Microsoft YaHei", sans-serif' font-size="18" fill="#0D0D0D" font-weight="900">建议：正式讲解 18-20 分钟，程序演示 6-8 分钟。</text></g>
