    <path d="M288 430 H406" stroke="#0169CC" stroke-width="4"/>
    <rect x="406" y="404" width="162" height="52" rx="26" fill="#0D0D0D"/><text x="434" y="438" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" fill="#FFFFFF">发现设备</text>
