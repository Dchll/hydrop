    <rect x="362" y="150" width="262" height="170" rx="18" fill="#FFFFFF" fill-opacity="0.82" stroke="#0169CC" stroke-width="2" stroke-dasharray="10 8"/><text x="420" y="238" font-family='SimHei, "Microsoft YaHei", sans-serif' font-size="21" fill="#0D0D0D" font-weight="900">聊天附件</text>
    <rect x="654" y="150" width="262" height="170" rx="18" fill="#FFFFFF" fill-opacity="0.82" stroke="#0169CC" stroke-width="2" stroke-dasharray="10 8"/><text x="712" y="238" font-family='SimHei, "Microsoft YaHei", sans-serif' font-size="21" fill="#0D0D0D" font-weight="900">传输进度</text>
    <rect x="946" y="150" width="262" height="170" rx="18" fill="#FFFFFF" fill-opacity="0.82" stroke="#0169CC" stroke-width="2" stroke-dasharray="10 8"/><text x="998" y="238" font-family='SimHei, "Microsoft YaHei", sans-serif' font-size="21" fill="#0D0D0D" font-weight="900">设置二维码</text>
